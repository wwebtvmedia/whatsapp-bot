
services:
  whatsapp-bot:
    build: .
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./downloads:/usr/src/app/downloads:Z
      - ./auth:/usr/src/app/auth:Z
      - ./backups:/usr/src/app/backups:Z
    depends_on:
      - mongo
      - chromadb
      - embeddings

  mongo:
    image: docker.io/library/mongo:6
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./data/db:/data/db:Z

  chromadb:
    image: docker.io/chromadb/chroma:latest
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS=http://localhost:3000
    volumes:
      # Chroma 1.x persists to /data (image config persist_path) — mounting the
      # legacy /chroma path left the vectors inside the container layer, lost
      # on every recreate
      - ./data/chroma:/data:Z

  embeddings:
    build:
      context: ./embedding-service
    restart: always
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./embedding-service:/app:Z
    working_dir: /app
    command: ["python", "main.py"]
    environment:
      - TRANSFORMERS_CACHE=/app/cache
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
    depends_on:
      - mongo

  llamacpp:
    # Only started with `--profile local-llm` (install.sh starts it when no
    # remote Ollama server is reachable)
    profiles: ["local-llm"]
    # Images are fully qualified: podman refuses short names when the host has
    # no unqualified-search-registries in /etc/containers/registries.conf
    image: ghcr.io/ggerganov/llama.cpp:server
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:Z
    environment:
      - LLAMA_ARG_MODEL=/models/model.gguf
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
      - LLAMA_ARG_N_GPU_LAYERS=0 # Change if GPU is available
    # command: ["--model", "/models/model.gguf", "--host", "0.0.0.0", "--port", "8080"]
